<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Terrain long — cible</title>

<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0;font-family:'Oswald',sans-serif;background:#232919}</style>
<style>body{display:flex;justify-content:center;align-items:flex-start;background:#141810;padding:24px;min-height:100vh}</style>

</head>
<body>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: #232919; overflow: hidden;">
  <div style="flex: 0 0 46px; background: #27607e; display: flex; align-items: center; justify-content: center; gap: 8px;">
    <button aria-label="Cigales" style="width: 34px; height: 34px; background: #f2ecdc; border: 2px solid #1d3a4f; border-radius: 4px; box-shadow: 0 2px 0 rgba(0, 0, 0, 0.35); display: flex; align-items: center; justify-content: center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1d3a4f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"></path><path d="M16 9l5 6"></path><path d="M21 9l-5 6"></path></svg></button>
    <button aria-label="Musique" style="width: 34px; height: 34px; background: #f2ecdc; border: 2px solid #1d3a4f; border-radius: 4px; box-shadow: 0 2px 0 rgba(0, 0, 0, 0.35); display: flex; align-items: center; justify-content: center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1d3a4f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="18" r="3"></circle><circle cx="17" cy="16" r="3"></circle><path d="M10 18V5l10-2v13"></path></svg></button>
    <button aria-label="Aide" style="width: 34px; height: 34px; background: #f2ecdc; border: 2px solid #1d3a4f; border-radius: 4px; box-shadow: 0 2px 0 rgba(0, 0, 0, 0.35); display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 700; color: #1d3a4f;">?</button>
    <button aria-label="Accueil" style="width: 34px; height: 34px; background: #f2ecdc; border: 2px solid #1d3a4f; border-radius: 4px; box-shadow: 0 2px 0 rgba(0, 0, 0, 0.35); display: flex; align-items: center; justify-content: center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1d3a4f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11 12 4l9 7"></path><path d="M5 10v9h14v-9"></path><path d="M10 19v-5h4v5"></path></svg></button>
  </div>
  <!-- BANDE FIXE : identique au terrain classique — elle ne bouge JAMAIS -->
  <div style="flex: 0 0 118px; position: relative; overflow: hidden; background: linear-gradient(180deg, #a9d3e8, #cfe6ef);">
    <div style="position: absolute; bottom: 22px; left: 0; right: 0; height: 30px; background: #ead9bb; border-top: 4px solid #c07a52;"></div>
    <div style="position: absolute; bottom: 0; left: 0; right: 0; height: 22px; background: #d8c49a; border-top: 4px solid #c9b183;"></div>
    <div style="position: absolute; bottom: 40px; left: 12px; width: 42px; height: 36px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #9ac46e, #6d9a4e);"></div>
    <div style="position: absolute; bottom: 42px; right: 16px; width: 46px; height: 40px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #9ac46e, #6d9a4e);"></div>
    <div style="position: absolute; top: 74px; left: 104px; width: 10px; height: 34px; background: linear-gradient(90deg, #8a6540, #6b4e30); border-radius: 2px;"></div>
    <div style="position: absolute; top: 74px; right: 104px; width: 10px; height: 34px; background: linear-gradient(90deg, #8a6540, #6b4e30); border-radius: 2px;"></div>
    <div style="position: absolute; top: 106px; left: 92px; width: 34px; height: 5px; background: rgba(70, 55, 30, 0.28); border-radius: 3px;"></div>
    <div style="position: absolute; top: 106px; right: 92px; width: 34px; height: 5px; background: rgba(70, 55, 30, 0.28); border-radius: 3px;"></div>
    <div style="position: absolute; top: 8px; left: 10px; right: 10px; height: 68px; background: repeating-linear-gradient(180deg, rgba(122, 90, 53, 0.14) 0 3px, rgba(0, 0, 0, 0) 3px 14px), linear-gradient(180deg, #c59a63, #a87d4b); border: 3px solid #7a5a35; border-radius: 8px; box-shadow: 0 4px 0 rgba(0, 0, 0, 0.4), inset 0 0 12px rgba(74, 47, 22, 0.35);">
      <div style="position: absolute; top: 5px; left: 10px; right: 10px; height: 16px; border-top: 2px solid #7a5a35; border-bottom: 2px solid #7a5a35; display: flex; justify-content: space-between; align-items: center; padding: 0 3px; font-size: 10px; font-weight: 700; color: #4a2f16;">
        <span style="width: 14px; height: 14px; border-radius: 50%; background: #2ba3d4; box-shadow: 0 0 0 1.5px #4a2f16; color: #ffffff; display: inline-flex; align-items: center; justify-content: center;">5</span><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span><span>7</span><span>8</span><span>9</span><span>10</span><span>11</span><span>12</span><span>13</span>
      </div>
      <div style="position: absolute; top: 25px; left: 10px; right: 10px; height: 16px; border-top: 2px solid #7a5a35; border-bottom: 2px solid #7a5a35; display: flex; justify-content: space-between; align-items: center; padding: 0 3px; font-size: 10px; font-weight: 700; color: #4a2f16;">
        <span style="width: 14px; height: 14px; border-radius: 50%; background: #bd4f3a; box-shadow: 0 0 0 1.5px #4a2f16; color: #ffffff; display: inline-flex; align-items: center; justify-content: center;">3</span><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span><span>7</span><span>8</span><span>9</span><span>10</span><span>11</span><span>12</span><span>13</span>
      </div>
      <div style="position: absolute; top: 46px; left: 12px; right: 12px; display: flex; justify-content: space-between; align-items: center; font-size: 11px; font-weight: 700; color: #4a2f16;">
        <span style="flex: 1; display: flex; align-items: center; gap: 3px;"><span style="width: 7px; height: 7px; border-radius: 50%; background: #2ba3d4; box-shadow: 0 0 0 1.2px #4a2f16;"></span>2</span>
        <span style="font-size: 10px; font-weight: 600; letter-spacing: 2px; color: #4a2f16; text-shadow: 0 1px 0 rgba(255, 240, 214, 0.35);">MÈNE 6 · <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#4a2f16" stroke-width="2.4" stroke-linecap="round" style="vertical-align: -1px;"><circle cx="12" cy="13" r="8"></circle><path d="M12 9v4l3 2"></path><path d="M9 2h6"></path></svg> 14 · <span style="color: #1a6e9c;">MARIUS</span></span>
        <span style="flex: 1; display: flex; align-items: center; justify-content: flex-end; gap: 3px;">2<span style="width: 7px; height: 7px; border-radius: 50%; background: #bd4f3a; box-shadow: 0 0 0 1.2px #4a2f16;"></span></span>
      </div>
    </div>
  </div>
  <!-- FENÊTRE CAMÉRA (défile sous la bande fixe) — ici : phase de VISÉE, ancrée sur le cercle -->
  <div style="flex: 1 1 auto; position: relative; overflow: hidden; background: radial-gradient(160px 100px at 66% 76%, rgba(112, 88, 52, 0.18), rgba(112, 88, 52, 0) 70%), #d8c49a;">
    <!-- lignes latérales du terrain long (pas de ligne de fond visible : elle est loin devant) -->
    <div style="position: absolute; top: -20px; bottom: 120px; left: 22px; border-left: 2px solid rgba(242, 236, 220, 0.8);"></div>
    <div style="position: absolute; top: -20px; bottom: 120px; right: 22px; border-right: 2px solid rgba(242, 236, 220, 0.8);"></div>
    <div style="position: absolute; bottom: 120px; left: 22px; right: 22px; border-top: 2px solid rgba(242, 236, 220, 0.8);"></div>
    <!-- cercle de lancer : l'ANCRAGE de la caméra pendant la visée -->
    <div style="position: absolute; bottom: 140px; left: 50%; margin-left: -26px; width: 52px; height: 52px; border: 2px solid #8a6b43; border-radius: 50%;"></div>
    <!-- repère de direction : court, discret, partant du cercle -->
    <div style="position: absolute; bottom: 196px; left: 50%; margin-left: -1px; width: 2px; height: 64px; background: repeating-linear-gradient(180deg, rgba(107, 87, 58, 0.55) 0 6px, rgba(0, 0, 0, 0) 6px 12px);"></div>
    <!-- mini-carte : tout le terrain + zone cochonnet + cadre de vue en bas -->
    <div style="position: absolute; top: 14px; right: 8px; width: 46px; height: 336px; background: #cdb98f; border: 1.5px solid #efe6cf; opacity: 0.94;">
      <div style="position: absolute; top: 52px; left: 12px; width: 5px; height: 5px; border-radius: 50%; background: #c67f1e;"></div>
      <div style="position: absolute; top: 44px; left: 22px; width: 5px; height: 5px; border-radius: 50%; background: #2ba3d4;"></div>
      <div style="position: absolute; top: 60px; left: 26px; width: 5px; height: 5px; border-radius: 50%; background: #bd4f3a;"></div>
      <div style="position: absolute; top: 38px; left: 6px; width: 32px; height: 34px; border: 1.5px solid #f2ecdc;"></div>
      <div style="position: absolute; bottom: 6px; left: 6px; width: 32px; height: 38px; border: 1.5px solid #26200c;"></div>
      <div style="position: absolute; bottom: 12px; left: 20px; width: 2px; height: 26px; background: rgba(107, 87, 58, 0.7);"></div>
    </div>
  </div>
  <div style="flex: 0 0 44px; display: flex; align-items: center; gap: 6px; padding: 0 6px; background: #232919;">
    <button style="flex: 1; height: 38px; background: #f6c324; border: 2px solid #1d3a4f; border-radius: 4px; box-shadow: 0 2px 0 #1d3a4f; font-family: 'Oswald', sans-serif; font-size: 14px; font-weight: 700; letter-spacing: 1.5px; color: #1d3a4f;">POINTER</button>
    <button style="flex: 1; height: 38px; background: #f2ecdc; border: 2px solid #1d3a4f; border-radius: 4px; box-shadow: 0 2px 0 rgba(29, 58, 79, 0.6); font-family: 'Oswald', sans-serif; font-size: 14px; font-weight: 600; letter-spacing: 1.5px; color: #1d3a4f;">TIRER</button>
    <button aria-label="Options" style="width: 38px; height: 38px; background: #f2ecdc; border: 2px solid #1d3a4f; border-radius: 4px; box-shadow: 0 2px 0 rgba(29, 58, 79, 0.6); display: flex; align-items: center; justify-content: center;"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#1d3a4f" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v3M12 19v3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M2 12h3M19 12h3M4.9 19.1 7 17M17 7l2.1-2.1"></path></svg></button>
  </div>
</div>
</body>
</html>
