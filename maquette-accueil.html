<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Accueil</title>

<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&amp;family=Oswald:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Oswald',sans-serif;background:#232919}
a{color:#1d3a4f}a:hover{color:#10222f}
</style>
<style>body{display:flex;justify-content:center;align-items:flex-start;background:#141810;padding:24px;min-height:100vh}</style>

</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 24px 20px; display: flex; flex-direction: column; align-items: center; gap: 18px; background: linear-gradient(180deg, #27607e 0%, #333d24 62%, #232919 100%);">
  <div style="display: flex; flex-direction: column; align-items: center; gap: 6px; margin-top: 26px;">
    <h1 style="margin: 0; font-family: 'Alfa Slab One', serif; font-size: 46px; line-height: 1; color: #f2ecdc; text-shadow: 3px 3px 0 rgba(16, 26, 16, 0.45); letter-spacing: 1px;">P&Eacute;TANQUE&nbsp;!</h1>
    <div style="font-size: 12px; font-weight: 600; letter-spacing: 2.5px; color: #8fd4f0;">LE JEU D'AP&Eacute;RO &mdash; 9 JOUEURS &middot; 13 POINTS &middot; 1 LIEN</div>
  </div>
  <div style="width: 100%; box-sizing: border-box; background: #f2ecdc; border: 3px solid #1d3a4f; border-radius: 6px; box-shadow: 0 4px 0 rgba(0, 0, 0, 0.35), inset 0 0 0 3px #f2ecdc, inset 0 0 0 4px #1d3a4f; padding: 20px 16px; display: flex; flex-direction: column; gap: 12px;">
    <label for="nom" style="font-size: 12px; font-weight: 600; letter-spacing: 1.5px; color: #1d3a4f;">NOM DE JOUEUR</label>
    <div style="display: flex; gap: 8px;">
      <input id="nom" value="Fernand" style="flex-grow: 1; min-width: 0; box-sizing: border-box; background: #faf6ea; border: 2px solid #1d3a4f; border-radius: 4px; padding: 10px 12px; font-family: 'Oswald', sans-serif; font-size: 17px; color: #1d3a4f;">
      <button aria-label="Nom au hasard" style="width: 46px; height: 46px; flex-shrink: 0; background: #faf6ea; border: 2px solid #1d3a4f; border-radius: 4px; box-shadow: 0 3px 0 rgba(29, 58, 79, 0.6); display: flex; align-items: center; justify-content: center; cursor: pointer;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1d3a4f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"></rect><circle cx="8.5" cy="8.5" r="1.4" fill="#1d3a4f" stroke="none"></circle><circle cx="15.5" cy="15.5" r="1.4" fill="#1d3a4f" stroke="none"></circle><circle cx="15.5" cy="8.5" r="1.4" fill="#1d3a4f" stroke="none"></circle><circle cx="8.5" cy="15.5" r="1.4" fill="#1d3a4f" stroke="none"></circle></svg>
      </button>
    </div>
    <label for="code" style="font-size: 12px; font-weight: 600; letter-spacing: 1.5px; color: #1d3a4f;">CODE DE LA PARTIE</label>
    <div style="display: flex; gap: 8px;">
      <input id="code" value="PLATANE66" style="flex-grow: 1; min-width: 0; box-sizing: border-box; background: #faf6ea; border: 2px solid #1d3a4f; border-radius: 4px; padding: 10px 12px; font-family: 'Oswald', sans-serif; font-size: 17px; letter-spacing: 1px; color: #1d3a4f;">
      <button aria-label="Code au hasard" style="width: 46px; height: 46px; flex-shrink: 0; background: #faf6ea; border: 2px solid #1d3a4f; border-radius: 4px; box-shadow: 0 3px 0 rgba(29, 58, 79, 0.6); display: flex; align-items: center; justify-content: center; cursor: pointer;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1d3a4f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.6-6.4"></path><path d="M21 3v6h-6"></path></svg>
      </button>
    </div>
    <button style="margin-top: 6px; width: 100%; background: #f6c324; border: 2px solid #1d3a4f; border-radius: 4px; box-shadow: 0 3px 0 #1d3a4f; padding: 13px 10px; font-family: 'Oswald', sans-serif; font-size: 17px; font-weight: 700; letter-spacing: 1.5px; color: #1d3a4f; cursor: pointer;">REJOINDRE LA PARTIE</button>
    <button style="width: 100%; background: transparent; border: 2px solid #1d3a4f; border-radius: 4px; box-shadow: 0 3px 0 rgba(29, 58, 79, 0.6); padding: 11px 10px; font-family: 'Oswald', sans-serif; font-size: 15px; font-weight: 600; letter-spacing: 1.5px; color: #1d3a4f; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1d3a4f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V4"></path><path d="M8 8l4-4 4 4"></path><path d="M4 14v5a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-5"></path></svg>
      PARTAGER LE LIEN
    </button>
  </div>
  <div style="display: flex; gap: 10px;">
    <button aria-label="Cigales" style="width: 46px; height: 46px; background: #f2ecdc; border: 2px solid #1d3a4f; border-radius: 4px; box-shadow: 0 3px 0 rgba(0, 0, 0, 0.35); display: flex; align-items: center; justify-content: center; cursor: pointer;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1d3a4f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"></path><path d="M15.5 8.5a5 5 0 0 1 0 7"></path><path d="M18.5 5.5a9.5 9.5 0 0 1 0 13"></path></svg>
    </button>
    <button aria-label="Musique" style="width: 46px; height: 46px; background: #f2ecdc; border: 2px solid #1d3a4f; border-radius: 4px; box-shadow: 0 3px 0 rgba(0, 0, 0, 0.35); display: flex; align-items: center; justify-content: center; cursor: pointer;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1d3a4f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="18" r="3"></circle><circle cx="17" cy="16" r="3"></circle><path d="M10 18V5l10-2v13"></path></svg>
    </button>
    <button aria-label="Aide" style="width: 46px; height: 46px; background: #f2ecdc; border: 2px solid #1d3a4f; border-radius: 4px; box-shadow: 0 3px 0 rgba(0, 0, 0, 0.35); display: flex; align-items: center; justify-content: center; cursor: pointer; font-family: 'Oswald', sans-serif; font-size: 20px; font-weight: 700; color: #1d3a4f;">?</button>
  </div>
</div>
</body>
</html>
