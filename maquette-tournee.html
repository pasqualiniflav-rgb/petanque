<!doctype html>

<head>

<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 20px; display: flex; align-items: center; justify-content: center; background: linear-gradient(rgba(16, 20, 11, 0.78), rgba(16, 20, 11, 0.78)), linear-gradient(180deg, #27607e 0%, #333d24 62%, #232919 100%);">

    <svg width="54" height="70" viewBox="0 0 54 70" fill="none" stroke="#1d3a4f" stroke-width="2.5" stroke-linejoin="round">
      <path d="M9 4h36l-6 40a12 12 0 0 1-24 0z" fill="#faf6ea"></path>

    <div style="font-size: 15px; font-weight: 500; letter-spacing: 0.5px; color: #1d3a4f; text-align: center; margin-top: -4px;">La tourn&eacute;e est pour&hellip;</div>
    <button style="width: 100%; background: #bd4f3a; border: 2px solid #1d3a4f; border-radius: 4px; box-shadow: 0 3px 0 #1d3a4f; padding: 13px 10px; font-family: 'Oswald', sans-serif; font-size: 16px; font-weight: 700; letter-spacing: 2px; color: #f2ecdc; cursor: pointer;">&Eacute;QUIPE ROUGE</button>
    <button style="width: 100%; background: #f6c324; border: 2px solid #1d3a4f; border-radius: 4px; box-shadow: 0 3px 0 #1d3a4f; padding: 13px 10px; font-family: 'Oswald', sans-serif; font-size: 16px; font-weight: 700; letter-spacing: 2px; color: #1d3a4f; cursor: pointer;">&Eacute;QUIPE OCRE</button>
